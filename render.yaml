services:
  - type: web
    name: nexus-civic-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: USE_MYSQL
        value: "false"
